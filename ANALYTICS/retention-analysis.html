<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retention Analysis | GUDAY</title>
    <link rel="icon" type="image/svg+xml" href="../COMPETITORS/favicon.svg">
    <link rel="stylesheet" href="https://use.typekit.net/lcw2zgr.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --purple-primary: #b282eb;
            --purple-deep: #7f56d9;
            --purple-dark: #1E192A;
            --purple-muted: #6d6daa;
            --bg-sidebar: #f9f8f6;
            --white: #ffffff;
            --text-dark: #1E192A;
            --bar-color: #7f56d9;
            --slide-w: 960px;
            --slide-h: 540px;
            --thumb-scale: 0.18;
            --weconvert-teal: #0ea5a0;
            --weconvert-dark: #0c2340;
            --weconvert-coral: #e8524f;
        }

        body {
            font-family: 'degular', 'Inter', system-ui, -apple-system, sans-serif;
            background: #e8e8e8;
            color: var(--text-dark);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            -webkit-font-smoothing: antialiased;
        }

        /* ── TOOLBAR ─────────────────────────────────── */
        .toolbar {
            height: 52px;
            background: var(--white);
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            position: relative;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toolbar-icon {
            width: 32px;
            height: 32px;
            background: var(--weconvert-dark);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toolbar-icon svg { width: 18px; height: 18px; }

        .toolbar-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-dark);
            letter-spacing: -0.3px;
        }

        .toolbar-title span {
            color: var(--purple-muted);
            font-weight: 400;
        }

        .toolbar-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-present {
            background: var(--weconvert-dark);
            color: white;
            border: none;
            padding: 9px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-present:hover { background: #091b33; transform: translateY(-1px); }
        .btn-present:active { transform: translateY(0); }
        .btn-present svg { width: 16px; height: 16px; }

        .btn-download {
            background: var(--white);
            color: var(--text-dark);
            border: 1px solid #ddd;
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s, border-color 0.2s;
        }

        .btn-download:hover { background: #f5f5f5; border-color: #bbb; transform: translateY(-1px); }
        .btn-download:active { transform: translateY(0); }
        .btn-download svg { width: 16px; height: 16px; }
        .btn-download:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .btn-edit { display: none; }
        .edit-only { display: none; }

        /* ── MAIN LAYOUT ─────────────────────────────── */
        .main-container {
            display: flex;
            height: calc(100vh - 52px);
        }

        /* ── THUMBNAIL PANEL ─────────────────────────── */
        .thumbnail-panel {
            width: 224px;
            min-width: 224px;
            background: #f1f1f1;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 10px 10px 10px 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .thumbnail-panel::-webkit-scrollbar { width: 5px; }
        .thumbnail-panel::-webkit-scrollbar-track { background: transparent; }
        .thumbnail-panel::-webkit-scrollbar-thumb { background: #c5c5c5; border-radius: 3px; }

        .thumb-wrap {
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 4px;
            padding: 3px;
            border-radius: 4px;
            transition: background 0.15s;
            flex-shrink: 0;
        }

        .thumb-wrap:hover { background: #e2e2e2; }

        .thumb-num {
            font-size: 10px;
            color: #999;
            min-width: 20px;
            text-align: right;
            padding-top: 1px;
            font-weight: 500;
            line-height: 1;
        }

        .thumb-frame {
            width: 172px;
            height: 97px;
            overflow: hidden;
            border-radius: 3px;
            border: 2px solid transparent;
            transition: border-color 0.2s, box-shadow 0.2s;
            position: relative;
            background: var(--white);
            flex-shrink: 0;
        }

        .thumb-wrap.active .thumb-frame {
            border-color: var(--weconvert-dark);
            box-shadow: 0 0 0 1px var(--weconvert-dark);
        }

        .thumb-inner {
            width: var(--slide-w);
            height: var(--slide-h);
            transform: scale(var(--thumb-scale));
            transform-origin: top left;
            pointer-events: none;
            position: absolute;
            top: 0; left: 0;
        }

        /* ── SLIDE AREA ──────────────────────────────── */
        .slide-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #d6d6d6;
            position: relative;
            overflow: hidden;
        }

        .slide-viewport {
            width: var(--slide-w);
            height: var(--slide-h);
            position: relative;
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
            border-radius: 2px;
            overflow: hidden;
            background: var(--white);
        }

        /* ── SLIDES ──────────────────────────────────── */
        .slide {
            width: 100%; height: 100%;
            position: absolute;
            top: 0; left: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s cubic-bezier(.4,0,.2,1),
                        transform 0.45s cubic-bezier(.4,0,.2,1);
            will-change: opacity, transform;
        }

        .slide.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
            z-index: 2;
        }

        .slide.entering-right { transform: translateX(40px); }
        .slide.entering-left  { transform: translateX(-40px); }
        .slide.exiting-right  { transform: translateX(40px); opacity: 0; z-index: 1; }
        .slide.exiting-left   { transform: translateX(-40px); opacity: 0; z-index: 1; }

        /* ── COVER SLIDE ─────────────────────────────── */
        .slide-cover {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #f0faf9 0%, #e8f7f6 30%, #f5fbfa 60%, #eaf8f0 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 80px;
            position: relative;
            overflow: hidden;
        }

        .slide-cover::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                linear-gradient(160deg, rgba(14,165,160,0.06) 0%, transparent 50%),
                linear-gradient(200deg, transparent 50%, rgba(14,165,160,0.03) 100%);
            pointer-events: none;
        }

        .slide-cover::after {
            content: '';
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 200px;
            height: 300px;
            background: linear-gradient(180deg, rgba(14,165,160,0.06) 0%, rgba(14,165,160,0.02) 100%);
            clip-path: polygon(15% 0%, 35% 100%, 50% 40%, 65% 100%, 85% 0%);
            pointer-events: none;
        }

        .cover-pre-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--weconvert-teal);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            position: relative;
        }

        .cover-title {
            font-size: 46px;
            font-weight: 800;
            color: var(--weconvert-dark);
            line-height: 1.08;
            margin-bottom: 16px;
            position: relative;
            letter-spacing: -1px;
        }

        .cover-underline {
            width: 280px;
            height: 4px;
            background: linear-gradient(90deg, var(--weconvert-teal), #2b7fd4);
            border-radius: 2px;
            margin-bottom: 16px;
            position: relative;
        }

        .cover-meta {
            color: #7a8a9a;
            font-size: 15px;
            position: relative;
            font-weight: 400;
        }

        .cover-logo {
            position: absolute;
            bottom: 30px;
            right: 40px;
        }

        .cover-logo svg {
            height: 24px;
            width: auto;
        }

        /* ── TABLE SLIDE ─────────────────────────────── */
        .slide-table {
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--white);
            padding: 28px 36px 20px;
        }

        .table-heading {
            font-size: 20px;
            font-weight: 800;
            color: var(--weconvert-dark);
            line-height: 1.2;
            margin-bottom: 18px;
        }

        .table-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .table-wrapper {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .table-wrapper thead tr {
            background: var(--weconvert-dark);
        }

        .table-wrapper th {
            color: white;
            font-weight: 600;
            padding: 10px 12px;
            text-align: center;
            font-size: 11.5px;
            letter-spacing: 0.3px;
        }

        .table-wrapper th:first-child {
            text-align: left;
            padding-left: 16px;
        }

        .table-wrapper td {
            padding: 10px 12px;
            text-align: center;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            font-weight: 500;
        }

        .table-wrapper td:first-child {
            text-align: left;
            font-weight: 600;
            padding-left: 16px;
        }

        .table-wrapper tbody tr:nth-child(even) {
            background: #f8fcfc;
        }

        .table-wrapper .highlight-row {
            background: rgba(14, 165, 160, 0.08) !important;
        }

        .table-wrapper .highlight-row td {
            font-weight: 700;
        }

        .table-wrapper .val-bold {
            font-weight: 700;
        }

        .table-wrapper .val-highlight {
            font-weight: 700;
            color: var(--weconvert-coral);
        }

        .table-wrapper .val-green {
            font-weight: 700;
            color: var(--weconvert-teal);
        }

        .table-conclusion {
            margin-top: 14px;
            padding: 14px 18px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12.5px;
            line-height: 1.65;
            color: #444;
        }

        .table-note {
            margin-top: 8px;
            font-size: 11px;
            color: #999;
            font-style: italic;
        }

        .table-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 10px;
        }

        .table-footer .funnel-source {
            font-size: 10px;
            color: #bbb;
        }

        .table-footer .funnel-brand svg {
            height: 16px;
            width: auto;
        }

        /* ── TABLE-SPLIT SLIDE ───────────────────────── */
        .table-split-body {
            flex: 1;
            display: flex;
            gap: 24px;
            position: relative;
        }

        .table-split-left {
            flex: 1;
            min-width: 0;
        }

        .table-split-right {
            width: 260px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .funnel-conclusion-item {
            font-size: 12px;
            line-height: 1.6;
            color: #444;
            padding: 10px 14px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 3px solid var(--weconvert-dark);
        }

        .funnel-conclusion-item strong {
            color: var(--weconvert-dark);
        }

        /* ── FUNNEL/BAR SLIDE ────────────────────────── */
        .slide-funnel {
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--white);
            padding: 28px 36px 20px;
        }

        .funnel-heading {
            font-size: 20px;
            font-weight: 800;
            color: var(--weconvert-dark);
            line-height: 1.2;
            margin-bottom: 18px;
        }

        .funnel-body {
            flex: 1;
            display: flex;
            gap: 24px;
            position: relative;
        }

        .funnel-chart-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .funnel-chart-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--weconvert-dark);
            margin-bottom: 10px;
        }

        .funnel-chart-wrapper {
            flex: 1;
            display: flex;
            position: relative;
        }

        .funnel-y-axis {
            width: 50px;
            position: relative;
            flex-shrink: 0;
        }

        .y-tick {
            position: absolute;
            right: 0;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .y-tick-label {
            font-size: 10px;
            color: #999;
            text-align: right;
            width: 40px;
            flex-shrink: 0;
        }

        .y-tick-line {
            flex: 1;
            height: 1px;
            background: #eee;
            margin-left: 6px;
        }

        .funnel-bars-area {
            flex: 1;
            display: flex;
            align-items: flex-end;
            gap: 6px;
            padding-bottom: 2px;
        }

        .funnel-bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .funnel-bar {
            width: 80%;
            border-radius: 4px 4px 0 0;
            position: relative;
            min-height: 2px;
            transition: height 0.5s ease;
        }

        .funnel-bar-value {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .funnel-bar-label {
            font-size: 10px;
            color: #666;
            margin-top: 6px;
            text-align: center;
            line-height: 1.2;
        }

        .funnel-conclusions {
            width: 260px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .funnel-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 10px;
        }

        .funnel-footer .funnel-source {
            font-size: 10px;
            color: #bbb;
        }

        .funnel-footer .funnel-brand svg {
            height: 16px;
            width: auto;
        }

        /* ── KPI CARDS ───────────────────────────────── */
        .kpi-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .kpi-card {
            flex: 1;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 14px 16px;
            text-align: center;
            border: 1px solid #eee;
        }

        .kpi-card .kpi-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #999;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .kpi-card .kpi-value {
            font-size: 22px;
            font-weight: 800;
            color: var(--weconvert-dark);
        }

        .kpi-card .kpi-sub {
            font-size: 10px;
            color: #aaa;
            margin-top: 2px;
        }

        .kpi-card.green .kpi-value { color: var(--weconvert-teal); }
        .kpi-card.coral .kpi-value { color: var(--weconvert-coral); }

        /* ── COMPARISON CARDS ────────────────────────── */
        .compare-row {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
        }

        .compare-card {
            flex: 1;
            border: 2px solid #eee;
            border-radius: 12px;
            padding: 16px;
            position: relative;
        }

        .compare-card.highlight {
            border-color: var(--weconvert-teal);
            background: rgba(14, 165, 160, 0.03);
        }

        .compare-card .compare-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #999;
            margin-bottom: 8px;
        }

        .compare-card.highlight .compare-title {
            color: var(--weconvert-teal);
        }

        .compare-card .compare-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--weconvert-dark);
            margin-bottom: 4px;
        }

        .compare-card .compare-sub {
            font-size: 11px;
            color: #aaa;
        }

        /* ── HORIZONTAL BAR CHART ────────────────────── */
        .hbar-chart {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .hbar-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hbar-label {
            width: 60px;
            font-size: 11px;
            font-weight: 600;
            color: #555;
            text-align: right;
            flex-shrink: 0;
        }

        .hbar-track {
            flex: 1;
            height: 22px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .hbar-fill {
            height: 100%;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            font-size: 10px;
            font-weight: 700;
            color: white;
            min-width: 30px;
            transition: width 0.5s ease;
        }

        .hbar-value {
            width: 55px;
            font-size: 11px;
            font-weight: 600;
            color: #555;
            text-align: left;
            flex-shrink: 0;
        }

        /* ── NAV ─────────────────────────────────────── */
        .slide-nav {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10;
        }

        .nav-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.8);
            color: var(--text-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            backdrop-filter: blur(4px);
        }

        .nav-btn:hover { background: rgba(255,255,255,1); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .nav-btn svg { width: 16px; height: 16px; }

        .slide-counter {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            min-width: 50px;
            text-align: center;
        }

        /* ── FULLSCREEN ──────────────────────────────── */
        .fullscreen-mode .toolbar,
        .fullscreen-mode .thumbnail-panel { display: none; }
        .fullscreen-mode .main-container { height: 100vh; }
        .fullscreen-mode .slide-area { background: #000; }

        /* ── ANNOTATIONS ─────────────────────────────── */
        .annotation-rect {
            position: absolute;
            border: 3px solid #e00;
            background: rgba(238, 0, 0, 0.06);
            border-radius: 3px;
            cursor: pointer;
            z-index: 5;
        }

        .edit-mode .annotation-rect:hover {
            background: rgba(238, 0, 0, 0.15);
        }

        /* ── BARS-TABLE SLIDE ─────────────────────────── */
        .slide-bars-table {
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--white);
            padding: 28px 36px 20px;
        }

        .bars-table-heading {
            font-size: 20px;
            font-weight: 800;
            color: var(--weconvert-dark);
            line-height: 1.2;
            margin-bottom: 14px;
        }

        .bars-table-body {
            flex: 1;
            display: flex;
            gap: 20px;
            position: relative;
        }

        .bars-table-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }

        .bars-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .bars-section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--weconvert-dark);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .bars-grid {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }

        .bar-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bar-item-label {
            width: 48px;
            font-size: 11px;
            font-weight: 600;
            color: #555;
            text-align: right;
            flex-shrink: 0;
        }

        .bar-item-track {
            flex: 1;
            height: 20px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .bar-item-fill {
            height: 100%;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding-left: 8px;
            font-size: 10px;
            font-weight: 700;
            color: white;
            min-width: 24px;
            transition: width 0.5s ease;
        }

        .bar-item-value {
            width: 60px;
            font-size: 11px;
            font-weight: 600;
            color: #333;
            flex-shrink: 0;
        }

        .bars-compare-row {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        .bars-compare-card {
            flex: 1;
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 10px 14px;
            text-align: center;
        }

        .bars-compare-card.highlight {
            border-color: var(--weconvert-teal);

    function coverHTML() {
        return `<div class="slide-cover">
            <div class="cover-pre-title">VAMOS DESCOBRIR</div>
            <div class="cover-title">Como seus clientes<br>estao recomprando?</div>

    function funnelHTML(d) {
        const maxTotal = Math.max(...d.stages.map(s => s.total));
        const magnitude = Math.pow(10, Math.floor(Math.log10(maxTotal)));
        const yMax = Math.ceil(maxTotal / magnitude) * magnitude;
        const ySteps = 5;
        const yInterval = yMax / ySteps;

        let yLabelsHTML = "";
        for (let i = 0; i <= ySteps; i++) {
            const val = yInterval * (ySteps - i);
            yLabelsHTML += `<div class="y-tick" style="top:${(i / ySteps) * 100}%"><span class="y-tick-label">${fmtNum(val)}</span><div class="y-tick-line"></div></div>`;
        }

        const barsHTML = d.stages.map((s, i) => {
            const heightPct = (s.total / yMax) * 100;
            const color = d.barColors[i] || "#0c2340";
            return `<div class="funnel-bar-col">
                <div class="funnel-bar" style="height:${heightPct}%;background:${color}">
                    <div class="funnel-bar-value" style="color:${color}">${fmtNum(s.total)}</div>
                </div>
                <div class="funnel-bar-label">${s.stage}</div>
            </div>`;
        }).join("");

        const conclusionsHTML = d.conclusions.map(c =>
            `<div class="funnel-conclusion-item">${c}</div>`
        ).join("");

        return `<div class="slide-funnel">
            <div class="funnel-heading">${d.heading}</div>
            <div class="funnel-body">
                <div class="funnel-chart-area">
                    <div class="funnel-chart-title">${d.chartTitle}</div>
                    <div class="funnel-chart-wrapper">
                        <div class="funnel-y-axis">${yLabelsHTML}</div>
                        <div class="funnel-bars-area">
                            ${barsHTML}
                        </div>
                    </div>
                </div>
                <div class="funnel-conclusions">
                    ${conclusionsHTML}
                </div>
            </div>
            <div class="funnel-footer">
                <span class="funnel-source">${d.source}</span>
                <span class="funnel-brand">${GUDAY_LOGO}</span>
            </div>
        </div>`;
    }

    function tableSplitHTML(d) {
        const headerHTML = d.columns.map(c => `<th>${c}</th>`).join("");
        const bodyHTML = d.fallbackRows.map((row, ri) => {
            const cells = row.map((cell, ci) => {
                const cellKey = ri + "-" + ci;
                let cls = "";
                if (d.highlightCells && d.highlightCells[cellKey]) cls = d.highlightCells[cellKey];
                return `<td class="${cls}">${cell}</td>`;
            }).join("");
            return `<tr>${cells}</tr>`;
        }).join("");

        const conclusionsHTML = d.conclusions.map(c =>
            `<div class="funnel-conclusion-item">${c}</div>`
        ).join("");

        return `<div class="slide-table">
            <div class="table-heading">${d.heading}</div>
            <div class="table-split-body">
                <div class="table-split-left">
                    <table class="table-wrapper">
                        <thead><tr>${headerHTML}</tr></thead>
                        <tbody>${bodyHTML}</tbody>
                    </table>
                </div>
                <div class="table-split-right">
                    ${conclusionsHTML}
                </div>
            </div>
            <div class="table-footer">
                <span class="funnel-source">${d.source}</span>
                <span class="funnel-brand">${GUDAY_LOGO}</span>
            </div>
        </div>`;
    }

    function barsTableHTML(d) {
        const maxLTV = Math.max(...d.ltvBars.map(b => b.ltv));
        const maxRet = Math.max(...d.ltvBars.map(b => b.ret));

        const ltvBarsHTML = d.ltvBars.map(b => {
            const widthPct = (b.ltv / maxLTV) * 85;
            return `<div class="bar-item">
                <div class="bar-item-label">${b.label}</div>
                <div class="bar-item-track">
                    <div class="bar-item-fill" style="width:${widthPct}%;background:${b.color}">R$ ${fmtNum(b.ltv)}</div>
                </div>
            </div>`;
        }).join("");

        const retBarsHTML = d.ltvBars.map(b => {
            const widthPct = (b.ret / maxRet) * 85;
            return `<div class="bar-item">
                <div class="bar-item-label">${b.label}</div>
                <div class="bar-item-track">
                    <div class="bar-item-fill" style="width:${widthPct}%;background:${b.color}">${b.ret}%</div>
                </div>
            </div>`;
        }).join("");

        const conclusionsHTML = d.conclusions.map(c =>
            `<div class="funnel-conclusion-item">${c}</div>`
        ).join("");

        const ltvTitle = d.ltvTitle || "LTV por quantidade de potes no 1o pedido";
        const retTitle = d.retTitle || "Taxa de recompra por quantidade de potes";

        return `<div class="slide-bars-table">

            <div class="table-footer">
                <span class="funnel-source">${d.source}</span>
                <span class="funnel-brand">${GUDAY_LOGO}</span>
            </div>
        </div>`;
    }

            </div>
            <div class="table-footer">
                <span class="funnel-source">${d.source}</span>
                <span class="funnel-brand">${GUDAY_LOGO}</span>
            </div>
        </div>`;
    }

    function slideHTML(d) {
        if (d.type === "cover") return coverHTML();
        if (d.type === "gap-cards") return gapCardsHTML(d);
        if (d.type === "funnel") return funnelHTML(d);
        if (d.type === "bars-table") return barsTableHTML(d);
        if (d.type === "coupon-compare") return couponCompareHTML(d);
        if (d.type === "crosssell-compare") return crosssellCompareHTML(d);
        if (d.type === "table-split") return tableSplitHTML(d);
        return "";
    }

    /* ── BUILD DOM ─────────────────────────────── */
    const viewport = document.getElementById("slideViewport");
    const panel    = document.getElementById("thumbPanel");
    const counter  = document.getElementById("counter");
    const btnPrev  = document.getElementById("btnPrev");
    const btnNext  = document.getElementById("btnNext");

    slides.forEach((d, i) => {
        const el = document.createElement("div");
        el.className = "slide" + (i === 0 ? " active" : "");
        el.innerHTML = slideHTML(d);
        viewport.appendChild(el);

        const tw = document.createElement("div");
        tw.className = "thumb-wrap" + (i === 0 ? " active" : "");
        tw.onclick = () => goTo(i);

        const tn = document.createElement("div");
        tn.className = "thumb-num";
        tn.textContent = i + 1;

        const tf = document.createElement("div");
        tf.className = "thumb-frame";

        const ti = document.createElement("div");
        ti.className = "thumb-inner";
        ti.innerHTML = slideHTML(d);

        tf.appendChild(ti);
        tw.appendChild(tn);
        tw.appendChild(tf);
        panel.appendChild(tw);
    });

    /* ── NAVIGATION ────────────────────────────── */
    function goTo(idx) {
        if (idx === cur || idx < 0 || idx >= total) return;
        const dir = idx > cur ? 1 : -1;
        const slideEls = viewport.children;
        const thumbs = panel.querySelectorAll(".thumb-wrap");

        slideEls[cur].classList.remove("active");
        slideEls[cur].classList.add(dir > 0 ? "exiting-left" : "exiting-right");

        slideEls[idx].classList.add(dir > 0 ? "entering-right" : "entering-left");
        void slideEls[idx].offsetWidth;
        slideEls[idx].classList.remove("entering-right", "entering-left");
        slideEls[idx].classList.add("active");

        const oldCur = cur;
        setTimeout(() => { slideEls[oldCur].classList.remove("exiting-left", "exiting-right"); }, 500);

        thumbs[cur].classList.remove("active");
        thumbs[idx].classList.add("active");
        thumbs[idx].scrollIntoView({ behavior: "smooth", block: "nearest" });

        cur = idx;
        updateUI();
    }

    function next() { goTo(cur + 1); }
    function prev() { goTo(cur - 1); }

    function updateUI() {
        counter.textContent = (cur + 1) + " / " + total;
        btnPrev.disabled = cur === 0;
        btnNext.disabled = cur === total - 1;
    }

    btnPrev.onclick = prev;
    btnNext.onclick = next;
    updateUI();

    /* ── KEYBOARD ──────────────────────────────── */
    document.addEventListener("keydown", e => {
        if (document.activeElement && document.activeElement.hasAttribute("contenteditable")) return;
        if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " ") { e.preventDefault(); next(); }
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); prev(); }
        else if (e.key === "Escape") { exitFS(); }
        else if (e.key === "Home") { e.preventDefault(); goTo(0); }
        else if (e.key === "End") { e.preventDefault(); goTo(total - 1); }
    });

    /* ── FULLSCREEN ────────────────────────────── */
    function toggleFullscreen() { document.fullscreenElement ? exitFS() : enterFS(); }
    function enterFS() {
        document.body.classList.add("fullscreen-mode");
        document.documentElement.requestFullscreen().catch(() => {});
        setTimeout(resizeSlide, 50);
    }
    function exitFS() {
        document.body.classList.remove("fullscreen-mode");
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        setTimeout(resizeSlide, 50);
    }
    document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement) { document.body.classList.remove("fullscreen-mode"); resizeSlide(); }
    });
    window.toggleFullscreen = toggleFullscreen;

    /* ── PDF ────────────────────────────────────── */
    async function downloadPDF() {
        const btn = document.getElementById("btnDownload");
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Gerando...`;
        try {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: "landscape", unit: "px", format: [960, 540] });
            const slideEls = viewport.querySelectorAll(".slide");
            const savedCur = cur;
            slideEls.forEach(s => { s.style.transition = "none"; s.style.opacity = "1"; s.style.transform = "none"; s.style.pointerEvents = "auto"; });
            viewport.style.transform = "none";
            viewport.style.width = "960px";
            viewport.style.height = "540px";
            for (let i = 0; i < slideEls.length; i++) {
                slideEls.forEach((s, j) => { s.style.display = j === i ? "block" : "none"; });
                await new Promise(r => setTimeout(r, 150));
                const canvas = await html2canvas(viewport, { width: 960, height: 540, scale: 2, useCORS: true, allowTaint: true, backgroundColor: "#ffffff" });
                const imgData = canvas.toDataURL("image/jpeg", 0.92);
                if (i > 0) pdf.addPage([960, 540], "landscape");
                pdf.addImage(imgData, "JPEG", 0, 0, 960, 540);
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> ${i + 1}/${slideEls.length}`;
            }
            slideEls.forEach((s, j) => { s.style.display = ""; s.style.transition = ""; s.style.opacity = ""; s.style.transform = ""; s.style.pointerEvents = ""; s.classList.toggle("active", j === savedCur); });
            resizeSlide();
            pdf.save("Retention-Analysis-GUDAY.pdf");
        } catch (err) { console.error("PDF error:", err); alert("Erro ao gerar PDF."); }
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
    window.downloadPDF = downloadPDF;

    /* ── RESPONSIVE ────────────────────────────── */
    function resizeSlide() {
        const area = viewport.parentElement;
        const aw = area.clientWidth - 100;
        const ah = area.clientHeight - 50;
        const sw = 960, sh = 540;
        const scale = Math.min(aw / sw, ah / sh, 2);
        viewport.style.transform = `scale(${scale})`;
        viewport.style.transformOrigin = "center center";
        viewport.style.width = sw + "px";
        viewport.style.height = sh + "px";
    }

    window.addEventListener("resize", resizeSlide);
    resizeSlide();
    setTimeout(resizeSlide, 200);

    /* ── EDIT MODE ─────────────────────────────── */
    const EDIT_KEY = "guday-retention-edits";
    let editMode = false;
    let editTool = "rect";
    let edits = { annotations: {}, texts: {} };
    let undoStack = [];

    async function loadEdits() {
        try {
            const resp = await fetch("retention-edits.json");
            if (resp.ok) { edits = await resp.json(); }
        } catch(e) {}
        if (!edits.annotations || !edits.texts) {
            try {
                const saved = localStorage.getItem(EDIT_KEY);
                if (saved) {
                    const local = JSON.parse(saved);
                    if (!edits.annotations) edits.annotations = local.annotations || {};
                    if (!edits.texts) edits.texts = local.texts || {};
                }
            } catch(e) {}
        }
        if (!edits.annotations) edits.annotations = {};
        if (!edits.texts) edits.texts = {};
        renderAnnotations();
        applyTextEdits();
    }

    function saveEdits() {
        localStorage.setItem(EDIT_KEY, JSON.stringify(edits));
    }

    function toggleEditMode() {
        editMode = !editMode;
        document.body.classList.toggle("edit-mode", editMode);
        document.querySelectorAll(".edit-only").forEach(el => {
            el.style.display = editMode ? "flex" : "none";
        });
        const btn = document.getElementById("btnEdit");
        btn.innerHTML = editMode
            ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Salvar`
            : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg> Editar`;
        if (editMode) {
            setEditTool("text");
            enableTextEditing();
        } else {
            document.body.classList.remove("edit-rect", "edit-text");
            viewport.querySelectorAll("[contenteditable]").forEach(el => {
                el.removeAttribute("contenteditable");
            });
            saveAllTexts();
        }
    }
    window.toggleEditMode = toggleEditMode;

    function setEditTool(tool) {
        editTool = tool;
        document.body.classList.toggle("edit-rect", tool === "rect");
        document.body.classList.toggle("edit-text", tool === "text");
        const btnR = document.getElementById("btnRect");
        const btnT = document.getElementById("btnText");
        if (btnR) btnR.classList.toggle("active", tool === "rect");
        if (btnT) btnT.classList.toggle("active", tool === "text");
        if (tool === "text") {
            enableTextEditing();
        } else {
            viewport.querySelectorAll("[contenteditable]").forEach(el => {
                el.removeAttribute("contenteditable");
            });
        }
    }
    window.setEditTool = setEditTool;

    function enableTextEditing() {
        viewport.querySelectorAll(".table-heading, .funnel-heading, .bars-table-heading, .funnel-conclusion-item, .table-conclusion, .cover-title, .cover-pre-title, .cover-meta, .funnel-chart-title, .bars-section-title").forEach(el => {
            el.setAttribute("contenteditable", "true");
        });
    }

    function saveAllTexts() {
        const slideEls = viewport.querySelectorAll(".slide");
        slideEls.forEach((slideEl, si) => {
            const editables = slideEl.querySelectorAll(".table-heading, .funnel-heading, .bars-table-heading, .funnel-conclusion-item, .table-conclusion, .cover-title, .cover-pre-title, .cover-meta, .funnel-chart-title, .bars-section-title");
            editables.forEach((el, ei) => {
                const key = si + "-" + ei;
                const original = slideDefs[si] ? null : null;
                edits.texts[key] = el.innerHTML;
            });
        });
        saveEdits();
    }

    function applyTextEdits() {
        if (!edits.texts) return;
        const slideEls = viewport.querySelectorAll(".slide");
        slideEls.forEach((slideEl, si) => {
            const editables = slideEl.querySelectorAll(".table-heading, .funnel-heading, .bars-table-heading, .funnel-conclusion-item, .table-conclusion, .cover-title, .cover-pre-title, .cover-meta, .funnel-chart-title, .bars-section-title");
            editables.forEach((el, ei) => {
                const key = si + "-" + ei;
                if (edits.texts[key]) {
                    el.innerHTML = edits.texts[key];
                }
            });
        });
        /* Also apply to thumbnails */
        const thumbInners = panel.querySelectorAll(".thumb-inner");
        thumbInners.forEach((thumbEl, si) => {
            const editables = thumbEl.querySelectorAll(".table-heading, .funnel-heading, .bars-table-heading, .funnel-conclusion-item, .table-conclusion, .cover-title, .cover-pre-title, .cover-meta, .funnel-chart-title, .bars-section-title");
            editables.forEach((el, ei) => {
                const key = si + "-" + ei;
                if (edits.texts[key]) {
                    el.innerHTML = edits.texts[key];
                }
            });
        });
    }

    /* ── ANNOTATIONS ──────────────────────────── */
    function renderAnnotations() {
        document.querySelectorAll(".annotation-rect").forEach(el => el.remove());
        Object.entries(edits.annotations).forEach(([key, rects]) => {
            const slideIdx = parseInt(key);
            const slideEl = viewport.children[slideIdx];
            if (!slideEl) return;
            const body = slideEl.querySelector(".funnel-body, .table-split-body, .table-body, .bars-table-body, .coupon-body, .gap-cards-body");
            if (!body) return;
            rects.forEach((r, ri) => {
                const div = document.createElement("div");
                div.className = "annotation-rect";
                div.style.left = r.x + "%";
                div.style.top = r.y + "%";
                div.style.width = r.w + "%";
                div.style.height = r.h + "%";
                div.addEventListener("click", (e) => {
                    if (!editMode || editTool !== "rect") return;
                    e.stopPropagation();
                    edits.annotations[key].splice(ri, 1);
                    if (edits.annotations[key].length === 0) delete edits.annotations[key];
                    saveEdits();
                    renderAnnotations();
                });
                body.appendChild(div);
            });
        });
    }

    let drawStart = null;
    viewport.addEventListener("mousedown", (e) => {
        if (!editMode || editTool !== "rect") return;
        const body = viewport.children[cur].querySelector(".funnel-body, .table-split-body, .table-body, .bars-table-body, .coupon-body, .gap-cards-body");
        if (!body || !body.contains(e.target) || e.target.classList.contains("annotation-rect")) return;
        const rect = body.getBoundingClientRect();
        drawStart = { x: (e.clientX - rect.left) / rect.width * 100, y: (e.clientY - rect.top) / rect.height * 100 };
    });

    viewport.addEventListener("mouseup", (e) => {
        if (!drawStart || !editMode || editTool !== "rect") return;
        const body = viewport.children[cur].querySelector(".funnel-body, .table-split-body, .table-body, .bars-table-body, .coupon-body, .gap-cards-body");
        if (!body) return;
        const rect = body.getBoundingClientRect();
        const endX = (e.clientX - rect.left) / rect.width * 100;
        const endY = (e.clientY - rect.top) / rect.height * 100;
        const x = Math.min(drawStart.x, endX);
        const y = Math.min(drawStart.y, endY);
        const w = Math.abs(endX - drawStart.x);
        const h = Math.abs(endY - drawStart.y);
        drawStart = null;
        if (w < 1 || h < 1) return;
        const key = cur.toString();
        if (!edits.annotations[key]) edits.annotations[key] = [];
        edits.annotations[key].push({ x: +x.toFixed(2), y: +y.toFixed(2), w: +w.toFixed(2), h: +h.toFixed(2) });
        undoStack.push(key);
        saveEdits();
        renderAnnotations();
    });

    function undoAnnotation() {
        if (undoStack.length === 0) return;
        const key = undoStack.pop();
        if (edits.annotations[key]) {
            edits.annotations[key].pop();
            if (edits.annotations[key].length === 0) delete edits.annotations[key];
        }
        saveEdits();
        renderAnnotations();
    }
    window.undoAnnotation = undoAnnotation;

    function clearSlideAnnotations() {
        delete edits.annotations[cur.toString()];
        saveEdits();
        renderAnnotations();
    }
    window.clearSlideAnnotations = clearSlideAnnotations;

    function exportJSON() {
        saveAllTexts();
        const blob = new Blob([JSON.stringify(edits, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "retention-edits.json";
        a.click();
        URL.revokeObjectURL(a.href);
    }
    window.exportJSON = exportJSON;

    /* ── URL PARAM ────────────────────────────── */
    const urlSlide = new URLSearchParams(window.location.search).get("slide");
    if (urlSlide) {
        const idx = parseInt(urlSlide) - 1;
        if (idx >= 0 && idx < total) { goTo(idx); }
    }

    loadEdits();

})();
</script>
</body>
</html>
